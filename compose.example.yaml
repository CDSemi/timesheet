# Example Compose file for one Timesheet instance (WP4-T04). Copy it to the host next to your private env file.
# Everything below is synthetic or a placeholder; real values live only in the protected host files.
#
#   docker compose up -d --build
#
# One instance, one host-local data directory (SQLite WAL needs local storage: never a remote SMB/NFS share or a
# synchronized folder). The container runs as UID/GID 10001, so the host directory must belong to that user
# (for example `chown 10001:10001 ./data && chmod 700 ./data`).
services:
  timesheet:
    build: .
    image: ${TIMESHEET_IMAGE:-timesheet:local}
    # The env file holds the real configuration (see .env.example). Keep it mode 600, outside git, and never paste
    # it into chat, screenshots or logs. It must at least set APP_ORIGINS and PUBLIC_BASE_URL (production refuses
    # to start without them). The image already sets NODE_ENV=production and OUTBOUND_MODE=capture.
    env_file:
      - ${TIMESHEET_ENV_FILE:-./timesheet.env}
    volumes:
      # Host-local bind mount: database, private files (PDFs, signatures, evidence) and the outbound capture.
      - ${TIMESHEET_DATA_DIR:-./data}:/data
    # No published port to the network by default: loopback only. Put the Synology reverse proxy in front, and
    # list its address in TRUSTED_PROXY_ADDRESSES. Never publish this port to the internet.
    ports:
      - "127.0.0.1:${TIMESHEET_PORT:-3000}:3000"
    restart: unless-stopped
    init: true
    # The job runner finishes its current job on SIGTERM; give it time before SIGKILL.
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
